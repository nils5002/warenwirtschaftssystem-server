<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon = die Bildmarke aus der Sidebar (Sidebar.tsx: Kachel in bg-primary mit
  dem Boxes-Glyph): abgerundetes Quadrat in Primaerblau, drei weisse Kartons.

  Bewusst vereinfacht statt 1:1 das Lucide-Icon: Dessen isometrische Linien
  verschwimmen bei 16 px zu einem Fleck. Drei flaechige Kartons mit Deckelfalz
  bleiben auch im Tab erkennbar.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Warenwirtschaftssystem">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7df6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#tile)"/>

  <g fill="#ffffff">
    <!-- oberer Karton -->
    <rect x="11.4" y="5.2" width="9.2" height="9.2" rx="1.8"/>
    <!-- untere Reihe -->
    <rect x="4.6" y="17.6" width="9.2" height="9.2" rx="1.8"/>
    <rect x="18.2" y="17.6" width="9.2" height="9.2" rx="1.8"/>
  </g>

  <!-- Deckelfalz: gibt den Flaechen Tiefe, ohne bei 16 px zu stoeren -->
  <g fill="#1d4ed8" opacity="0.85">
    <rect x="14.6" y="5.2" width="2.8" height="3.1" rx="0.6"/>
    <rect x="7.8" y="17.6" width="2.8" height="3.1" rx="0.6"/>
    <rect x="21.4" y="17.6" width="2.8" height="3.1" rx="0.6"/>
  </g>
</svg>
