<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Best-effort cache hints for the HTML shell. The hashed JS/CSS bundles
      under /assets/ can stay cached forever (their filenames change on every
      build), but this index.html must always be revalidated so the browser
      sees the new bundle hash after a deploy. Real enforcement should still
      happen via Cache-Control headers on the reverse proxy.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>ERP-System</title>
    <!--
      Reihenfolge ist Absicht: Browser mit SVG-Unterstuetzung nehmen die
      Vektorvariante (scharf auf jedem Zoom/DPI), aeltere fallen auf die PNG
      zurueck. Alle drei Dateien zeigen dieselbe Bildmarke wie die Sidebar
      (Kachel in Primaerblau mit drei Kartons) — Geometrie siehe favicon.svg.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        const storageKey = 'asset-console-theme';
        const stored = localStorage.getItem(storageKey);
        // UI-V2: Dark ist Default (muss zu resolveInitialTheme in useTheme.ts passen).
        const theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
