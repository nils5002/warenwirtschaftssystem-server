<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Referrer-Policy explizit festschreiben (statt sich auf den Browser-
      Default zu verlassen): Pfad und Query einer Seite verlassen den Origin
      damit nie. Relevant fuer /registrierung-bestaetigen?token=..., dessen
      Token sonst theoretisch ueber einen Referer abfliessen koennte. Die
      Seite entfernt den Token zusaetzlich sofort aus der Adresszeile.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      Best-effort cache hints for the HTML shell. The hashed JS/CSS bundles
      under /assets/ can stay cached forever (their filenames change on every
      build), but this index.html must always be revalidated so the browser
      sees the new bundle hash after a deploy. Real enforcement should still
      happen via Cache-Control headers on the reverse proxy.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>ERP-System</title>
    <!--
      Reihenfolge ist Absicht: Browser mit SVG-Unterstuetzung nehmen die
      Vektorvariante (scharf auf jedem Zoom/DPI), aeltere fallen auf die PNG
      zurueck. Alle drei Dateien zeigen dieselbe Bildmarke wie die Sidebar
      (Kachel in Primaerblau mit drei Kartons) — Geometrie siehe favicon.svg.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Warehouse Companion (installierbare PWA). Der Service Worker (public/sw.js)
      cacht bewusst weder die App-Huelle noch API-Daten — siehe dort.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#050b16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Warehouse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (() => {
        const storageKey = 'asset-console-theme';
        const stored = localStorage.getItem(storageKey);
        // UI-V2: Dark ist Default (muss zu resolveInitialTheme in useTheme.ts passen).
        const theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
