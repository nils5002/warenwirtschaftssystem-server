# CI-Sicherheitsnetz NACH dem Push: main wird direkt bespielt (Trunk-based,
# siehe CLAUDE.md §11), die verbindliche Pruefung laeuft lokal VOR dem Push
# (container-verify). Dieser Workflow faengt zusaetzlich ab, was nur auf
# Linux/frischem Checkout auffaellt (case-sensitive Pfade, fehlende Dateien).
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall app
      - name: Pytest (frische, isolierte DB)
        run: python -m pytest tests
        env:
          DATABASE_URL: sqlite:///./app/data/app.ci.db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (Vitest)
        run: npm run test
      - name: Production build
        run: npm run build
